services:
  - type: web
    name: loop-gpt-backend
    env: node
    plan: starter
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: loop-gpt-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app
      - key: PORT
        value: 3001

databases:
  - name: loop-gpt-db
    plan: free
    databaseName: loopgpt
    user: loopgpt

